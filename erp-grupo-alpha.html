<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ERP GRUPO ALPHA</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f3f3;--surf:#fff;--ink:#0a0a0a;--mut:#666;--line:#dcdcdc;--side:#000;--acc:#0a0a0a;--on:#fff;--ok:#0a0a0a;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--surf:#151515;--ink:#f2f2f2;--mut:#9a9a9a;--line:#2a2a2a;--side:#000;--acc:#fff;--on:#0a0a0a;--ok:#f2f2f2;--bad:#ff6b5e;color-scheme:dark}}
/*d*/:root[data-theme="dark"]{--bg:#0a0a0a;--surf:#151515;--ink:#f2f2f2;--mut:#9a9a9a;--line:#2a2a2a;--side:#000;--acc:#fff;--on:#0a0a0a;--ok:#f2f2f2;--bad:#ff6b5e;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--side);color:#bdbdbd;padding:20px 12px;position:sticky;top:0;height:100vh;align-self:start}
.brand{padding:4px 10px 0;display:flex;flex-direction:column;gap:14px}.brand img{display:block;mix-blend-mode:lighten}.mark{width:104px;height:auto}.wm{display:flex;align-items:center;gap:8px}.wm img{width:118px;height:auto}.wm span{font-weight:800;font-size:19px;letter-spacing:.14em;color:#fff;border-left:1px solid #555;padding-left:10px;line-height:1}
nav ul{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:block;width:100%;padding:9px 10px;border-radius:6px;box-sizing:border-box;border-left:3px solid transparent}
nav button:hover{background:rgba(255,255,255,.1)}
nav button[aria-current=page]{background:#fff;color:#000;border-left-color:#fff;font-weight:600}
nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{padding:28px 32px;max-width:1100px;width:100%;min-width:0}
.grp{font-size:12px;font-weight:600;color:#7d7d7d;padding:14px 10px 4px}
.ledger input{margin-top:4px;max-width:160px}
h1{font-size:26px;margin:0 0 18px;font-weight:800}
h2{font-size:16px;margin:26px 0 10px}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surf);border:1px solid var(--line);border-radius:8px}
.ledger div{padding:16px 18px;border-right:1px solid var(--line)}
.ledger div:last-child{border-right:0}
.ledger span{display:block;color:var(--mut);font-size:13px}
.ledger b{font-size:22px;font-weight:800}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad)}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px;flex:1 1 130px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 9px;width:100%}
.btn{font:inherit;font-weight:600;background:var(--acc);color:var(--on);border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
.x{font:inherit;background:none;border:0;color:var(--bad);cursor:pointer;padding:4px 8px}
.tw{overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.empty{padding:22px;color:var(--mut);text-align:center}
.low{color:var(--bad);font-weight:600}
@media(max-width:760px){
body{grid-template-columns:1fr}
nav{position:sticky;height:auto;z-index:5;padding:12px 8px 8px;top:0}.brand{flex-direction:row;align-items:center;gap:12px}.mark{width:44px}.wm img{width:84px}.wm span{font-size:15px}
nav ul{flex-direction:row;overflow-x:auto;margin-top:10px}
nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
nav button[aria-current=page]{border-bottom-color:#fff;background:transparent;color:#fff}
main{padding:18px 14px}
.grp{display:none}
.ledger{grid-template-columns:1fr 1fr}
.ledger div:nth-child(2){border-right:0}
.ledger div:nth-child(-n+2){border-bottom:1px solid var(--line)}
}
</style>

<script>
const K='alpha_erp_v1';
let D={products:[],clients:[],suppliers:[],sales:[],purchases:[],fin:[],assets:[],staff:[],tickets:[],charges:[],cash:[],adv:[],pays:[]};
try{const s=localStorage.getItem(K);if(s)D=Object.assign(D,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>new Date().toISOString().slice(0,10);
const dt=s=>s?s.split('-').reverse().join('/'):'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pn=id=>(D.products.find(p=>p.id==id)||{}).nome||'(removido)';
const cn=id=>(D.clients.find(c=>c.id==id)||{}).nome||'Consumidor';
const fn=id=>(D.suppliers.find(c=>c.id==id)||{}).nome||'(removido)';
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
let tab='painel';
const TABS=[['painel','Painel','Geral'],['fin','Lançamentos','Financeiro'],['caixa','Caixa diário','Financeiro'],['bens','Ativos e passivos','Financeiro'],['rh','Funcionários','RH'],['sal','Pagamento de salários','RH'],['adi','Adiantamentos','RH'],['atend','Atendimento','Atendimento'],['clientes','Clientes','Atendimento'],['cobr','Cobranças','Cobranças'],['vendas','Vendas','Vendas'],['estoque','Estoque','Vendas'],['compras','Compras','Compras'],['fornec','Fornecedores','Compras'],['rel','Relatórios','Relatórios'],['bkp','Backup e restauração','Sistema']];
const field=(l,n,t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" ${x}></label>`;
const sel=(l,n,opts,x='')=>`<label>${l}<select name="${n}" ${x}>${opts}</select></label>`;
const opts=(a,f,blank)=>(blank?`<option value="">${blank}</option>`:'')+a.map(i=>`<option value="${i.id}">${esc(f(i))}</option>`).join('');
const table=(head,rows,empty)=>rows.length?`<div class="tw"><table><thead><tr>${head.map(h=>`<th${h[0]=='>'?' class="r"':''}>${h.replace('>','')}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="tw"><div class="empty">${empty}</div></div>`;
const del=(c,id)=>`<td class="r"><button class="x" data-del="${c}:${id}">Excluir</button></td>`;
const V={
painel(){
  const rec=sum(D.fin.filter(f=>f.tipo=='receita'),f=>f.valor),des=sum(D.fin.filter(f=>f.tipo=='despesa'),f=>f.valor);
  const low=D.products.filter(p=>p.qtd<=p.min);
  const last=[...D.fin].reverse().slice(0,6);

 return `<h1>Relatórios</h1><form data-f="noop"><label>Relatório<select data-rp="t">${Object.keys(RP).map(k=>`<option value="${k}" ${k==rp.t?'selected':''}>${RP[k].n}</option>`).join('')}</select></label>${d.dk?`<label>De<input type="date" value="${rp.de}" data-rp="de"></label><label>Até<input type="date" value="${rp.ate}" data-rp="ate"></label>`:''}<label>Título do relatório<input type="text" value="${esc(rp.tit)}" placeholder="${esc(d.n)}" data-rp="tit"></label><div style="flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px 16px"><span style="font-size:12px;color:var(--mut);width:100%">Colunas do relatório</span>${d.cols.map((c,i)=>`<label style="flex:0 0 auto;flex-direction:row;align-items:center;gap:5px;color:var(--ink);font-size:14px"><input type="checkbox" style="width:auto" data-rcol="${i}" ${rp.off.includes(i)?'':'checked'}>${c[0]}</label>`).join('')}</div><button type="button" class="btn" data-ex="pdf">Exportar PDF</button><button type="button" class="btn" data-ex="xls">Exportar Excel</button></form><h2>${esc(x.title)} (${x.vals.length} registro${x.vals.length==1?'':'s'})</h2>`+table(cols.map(c=>(c[2]?'>':'')+c[0]),x.disp.map(r=>`<tr>${r.map((v,i)=>`<td class="${cols[i][2]?'r':''}">${esc(v)}</td>`).join('')}</tr>`).concat(x.totd?[`<tr>${x.totd.map((v,i)=>`<td class="${cols[i][2]?'r':''}"><b>${esc(v)}</b></td>`).join('')}</tr>`]:[]),'Nenhum registro neste período.');
}});
const RP={
fin:{n:'Lançamentos financeiros',dk:'data',rows:()=>D.fin,cols:[['Data',r=>dt(r.data)],['Tipo',r=>r.tipo=='receita'?'Receita':'Despesa'],['Descrição',r=>r.desc],['Valor',r=>r.tipo=='receita'?r.valor:-r.valor,1]]},
caixa:{n:'Fechamentos de caixa',dk:'data',rows:()=>D.cash,cols:[['Dia',r=>dt(r.data)],['Abertura',r=>r.abertura,2],['Esperado',r=>r.esperado,2],['Contado',r=>r.contado,2],['Diferença',r=>r.dif,1]]},
vendas:{n:'Vendas',dk:'data',rows:()=>D.sales,cols:[['Data',r=>dt(r.data)],['Cliente',r=>cn(r.cliente)],['Produto',r=>pn(r.pid)],['Qtd',r=>r.qtd],['Total',r=>r.total,1]]},
compras:{n:'Compras',dk:'data',rows:()=>D.purchases,cols:[['Data',r=>dt(r.data)],['Fornecedor',r=>fn(r.fid)],['Produto',r=>pn(r.pid)],['Qtd',r=>r.qtd],['Total',r=>r.total,1]]},
estoque:{n:'Estoque',rows:()=>D.products,cols:[['Produto',r=>r.nome],['Código',r=>r.sku],['Custo',r=>r.custo,2],['Preço',r=>r.preco,2],['Estoque',r=>r.qtd],['Valor em estoque',r=>r.qtd*r.custo,1]]},
clientes:{n:'Clientes',rows:()=>D.clients,cols:[['Nome',r=>r.nome],['Telefone',r=>r.tel],['E-mail',r=>r.email]]},
fornec:{n:'Fornecedores',rows:()=>D.suppliers,cols:[['Nome',r=>r.nome],['Telefone',r=>r.tel],['E-mail',r=>r.email]]},
func:{n:'Funcionários',rows:()=>D.staff,cols:[['Nome',r=>r.nome],['Cargo',r=>r.cargo],['Setor',r=>r.setor],['Admissão',r=>dt(r.adm)],['Salário',r=>r.salario,1],['Situação',r=>r.status]]},
pays:{n:'Pagamentos de salários',dk:'data',rows:()=>D.pays,cols:[['Data',r=>dt(r.data)],['Funcionário',r=>sn(r.fid)],['Competência',r=>mm(r.mes)],['Bruto',r=>r.bruto,1],['Adiantamentos',r=>r.desc,1],['Líquido',r=>r.liq,1]]},
adv:{n:'Adiantamentos',dk:'data',rows:()=>D.adv,cols:[['Data',r=>dt(r.data)],['Funcionário',r=>sn(r.fid)],['Valor',r=>r.valor,1],['Situação',r=>r.status]]},
cobr:{n:'Cobranças',dk:'venc',rows:()=>D.charges,cols:[['Vencimento',r=>dt(r.venc)],['Cliente',r=>cn(r.cliente)],['Descrição',r=>r.desc],['Valor',r=>r.valor,1],['Situação',r=>r.status]]},
atend:{n:'Atendimentos',dk:'data',rows:()=>D.tickets,cols:[['Data',r=>dt(r.data)],['Cliente',r=>cn(r.cliente)],['Canal',r=>r.canal],['Assunto',r=>r.assunto],['Situação',r=>r.status]]},
bens:{n:'Ativos e passivos',rows:()=>D.assets,cols:[['Tipo',r=>r.tipo=='ativo'?'Ativo':'Passivo'],['Descrição',r=>r.nome],['Valor',r=>r.valor,2]]}
};
function rpData(){
 const d=RP[rp.t],cols=d.cols.filter((c,i)=>!rp.off.includes(i));
 const rows=d.rows().filter(r=>!d.dk||((!rp.de||r[d.dk]>=rp.de)&&(!rp.ate||r[d.dk]<=rp.ate)));
 const vals=rows.map(r=>cols.map(c=>c[1](r))),disp=vals.map(v=>cols.map((c,i)=>c[2]?R(v[i]):(v[i]==null?'':String(v[i]))));
 const tot=cols.map((c,i)=>c[2]==1?sum(vals,v=>v[i]):null),has=tot.some(t=>t!=null);
 const per=d.dk?`Período: ${rp.de?dt(rp.de):'início'} a ${rp.ate?dt(rp.ate):'hoje'}`:'Posição atual';
 return{cols,vals,disp,tot:has?tot:null,totd:has?cols.map((c,i)=>c[2]==1?R(tot[i]):i==0?'Total':''):null,title:rp.tit||d.n,per}}
const MK=()=>document.querySelector('.mark').src,WM=()=>document.querySelector('.wm img').src;
const fname=(t,e)=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\- ]/g,'').trim().replace(/\s+/g,'_')+'_'+today()+'.'+e;
async function dl(data,filename){try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename,data});return}const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){if(!e||e.code!='declined')alert('Não foi possível salvar o arquivo.')}}
function exPdf(){
 if(!(window.jspdf&&jspdf.jsPDF)){alert('Biblioteca de PDF indisponível. Verifique a conexão.');return}
 const x=rpData(),doc=new jspdf.jsPDF({unit:'pt',format:'a4',orientation:x.cols.length>5?'landscape':'portrait'}),W=doc.internal.pageSize.getWidth(),H2=doc.internal.pageSize.getHeight();
 doc.setFillColor(0,0,0);doc.rect(0,0,W,72,'F');
 doc.addImage(MK(),'PNG',30,10,59,50);doc.addImage(WM(),'PNG',104,20,107,30);
 doc.setTextColor(255,255,255).setFont('helvetica','bold').setFontSize(17).text('ERP',226,42);
 doc.setTextColor(10,10,10).setFontSize(16).text(x.title,40,104);
 doc.setFont('helvetica','normal').setFontSize(9).setTextColor(110,110,110).text(`${x.per}   |   Emitido em ${dt(today())}`,40,120);
 const cs={};x.cols.forEach((c,i)=>{if(c[2])cs[i]={halign:'right'}});
 doc.autoTable({startY:134,head:[x.cols.map(c=>c[0])],body:x.disp,foot:x.totd?[x.totd]:undefined,theme:'grid',styles:{fontSize:9,cellPadding:5,lineColor:[210,210,210]},headStyles:{fillColor:[0,0,0],textColor:255},footStyles:{fillColor:[235,235,235],textColor:0,fontStyle:'bold'},columnStyles:cs,margin:{left:40,right:40,bottom:44},didDrawPage:()=>{doc.setFontSize(8).setTextColor(120,120,120).text('ALPHA ERP - GRUPO ALPHA   |   Página '+doc.internal.getNumberOfPages(),40,H2-20)}});
 dl(doc.output('blob'),fname(x.title,'pdf'))}
async function exXls(){
 if(!window.ExcelJS){alert('Biblioteca de Excel indisponível. Verifique a conexão.');return}
 const x=rpData(),wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Relatório'),n=Math.max(x.cols.length,4),b=s=>s.split(',')[1],fmt='"R$" #,##0.00';
 [1,2].forEach(r=>{ws.getRow(r).height=32;for(let c=1;c<=n;c++)ws.getCell(r,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF000000'}}});
 ws.addImage(wb.addImage({base64:b(MK()),extension:'png'}),{tl:{col:0.05,row:0.12},ext:{width:60,height:51}});
 ws.addImage(wb.addImage({base64:b(WM()),extension:'png'}),{tl:{col:0.4,row:0.6},ext:{width:104,height:29}});
 ws.mergeCells('B1:B2');Object.assign(ws.getCell('B1'),{value:'ERP',font:{bold:true,size:16,color:{argb:'FFFFFFFF'}},alignment:{vertical:'middle'}});
 ws.getCell('A4').value=x.title;ws.getCell('A4').font={bold:true,size:15};
 ws.getCell('A5').value=`${x.per}  |  Emitido em ${dt(today())}`;ws.getCell('A5').font={color:{argb:'FF666666'}};
 ws.getRow(7).values=x.cols.map(c=>c[0]);
 x.cols.forEach((c,i)=>{const h=ws.getCell(7,i+1);h.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF000000'}};h.font={bold:true,color:{argb:'FFFFFFFF'}};if(c[2])h.alignment={horizontal:'right'}});
 const put=(r,v,bold)=>{ws.getRow(r).values=v;x.cols.forEach((c,i)=>{const k=ws.getCell(r,i+1);if(c[2]){k.numFmt=fmt;k.alignment={horizontal:'right'}}if(bold){k.font={bold:true};k.border={top:{style:'thin'}}}})};
 x.vals.forEach((v,i)=>put(8+i,v.map(z=>z==null?'':z)));
 if(x.tot)put(8+x.vals.length,x.tot.map((t,i)=>t==null?(i==0?'Total':''):t),true);
 x.cols.forEach((c,i)=>ws.getColumn(i+1).width=Math.min(50,Math.max(i==0?30:14,c[0].length+4,...x.disp.map(r=>String(r[i]).length+2))));
 dl(new Blob([await wb.xlsx.writeBuffer()]),fname(x.title,'xlsx'))}
document.addEventListener('change',e=>{const t=e.target,s=t.dataset;
 if(s.cxd!==undefined){cxd=t.value||today();render()}
 else if(s.ms!==undefined){mes=t.value||today().slice(0,7);render()}
 else if(s.rp){rp[s.rp]=t.value;if(s.rp=='t'){rp.off=[];rp.tit=''}render()}
 else if(s.rcol!==undefined){const i=+s.rcol;rp.off=t.checked?rp.off.filter(k=>k!=i):[...rp.off,i];render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-ex],[data-pay],[data-reopen]');if(!b)return;
 if(b.dataset.ex){b.dataset.ex=='pdf'?exPdf():exXls();return}
 if(b.dataset.reopen)D.cash=D.cash.filter(c=>c.id!=b.dataset.reopen);
 if(b.dataset.pay)pay(b.dataset.pay);
 save();render()});
V.bkp=()=>`<h1>Backup e restauração</h1><p style="max-width:640px;color:var(--mut)">Os dados ficam salvos neste navegador. Salve um backup com frequência e guarde o arquivo em local seguro (nuvem, e-mail ou pen drive). Para recuperar os dados ou levá-los para outro aparelho, restaure o arquivo.</p><form data-f="noop"><button type="button" class="btn" data-bk="save">Salvar backup agora</button><label style="max-width:340px">Restaurar backup (arquivo .json)<input type="file" accept=".json,application/json" data-bk-file></label></form><div class="ledger"><div><span>Lançamentos</span><b>${D.fin.length}</b></div><div><span>Produtos</span><b>${D.products.length}</b></div><div><span>Clientes</span><b>${D.clients.length}</b></div><div><span>Funcionários</span><b>${D.staff.length}</b></div></div>`;
document.addEventListener('click',e=>{if(e.target.closest('[data-bk]'))dl(JSON.stringify(D,null,1),fname('Backup ALPHA ERP','json'))});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.bkFile===undefined)return;const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!='object'||!Array.isArray(o.fin))throw 0;if(!confirm('Restaurar este backup substitui todos os dados atuais. Continuar?')){render();return}D=Object.assign({products:[],clients:[],suppliers:[],sales:[],purchases:[],fin:[],assets:[],staff:[],tickets:[],charges:[],cash:[],adv:[],pays:[]},o);save();render();alert('Backup restaurado.')}catch(x){alert('Arquivo de backup inválido.')}};r.readAsText(f)});
function render(){
  let g='';document.getElementById('menu').innerHTML=TABS.map(t=>(g!=t[2]?(g=t[2],`<li class="grp">${g}</li>`):'')+`<li><button data-tab="${t[0]}" ${t[0]==tab?'aria-current="page"':''}>${t[1]}</button></li>`).join('');
  document.getElementById('app').innerHTML=V[tab]();
}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;H[f.dataset.f](Object.fromEntries(new FormData(f)));save();render()});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
  const d=e.target.closest('[data-del]');if(d&&confirm('Excluir este registro?')){const[c,id]=d.dataset.del.split(':');D[c]=D[c].filter(x=>x.id!=id);save();render()}
});
render();
</script></body></html>
